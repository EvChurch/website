[build]
buildCommand = "npx payload generate:importmap && npm run build"

[deploy]
startCommand = "echo 'y' | npx payload migrate:fresh && npx tsx src/seed/seed-pages.ts && npm start -- -H 0.0.0.0"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

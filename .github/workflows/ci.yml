name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Payload types and import map
        env:
          # Include storage fields without using an external bucket or credentials.
          S3_BUCKET: synthetic-ci-typecheck
          S3_ENDPOINT: http://127.0.0.1:57151
        run: pnpm generate:types && pnpm generate:importmap

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

  rock-sync-image:
    name: Rock Sync production image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build controlled worker image
        run: docker build -f Dockerfile.rock-sync -t ev-rock-sync-security-ci .
      - name: Verify runtime trust and isolated actual worker handlers
        run: docker run --rm --entrypoint sh ev-rock-sync-security-ci scripts/verify-rock-sync-image.sh

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Payload types and import map
        env:
          # Include storage fields without using an external bucket or credentials.
          S3_BUCKET: synthetic-ci-typecheck
          S3_ENDPOINT: http://127.0.0.1:57151
        run: pnpm generate:types && pnpm generate:importmap

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test
